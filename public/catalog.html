<!DOCTYPE html>
<html lang="id">
<head>
    <script src="csrf.js"></script>
    <script src="pwa.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Catalog A-Z - AnimeHub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #1a1c23;
            --accent-color: #ff4757;
            --accent-glow: rgba(255, 71, 87, 0.3);
            --text-muted: #8a8d9b;
            --border-color: #2f3542;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px; 
            padding-bottom: 80px; 
        }

        .header-title {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- CONTROLS (SEARCH & FILTER) --- */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .filter-group {
            display: flex;
            gap: 10px;
        }

        .filter-select {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #ccc;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        /* --- CATALOG ITEM DESIGN --- */
        .catalog-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .catalog-item {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .catalog-item:hover {
            background: #252834;
            border-color: var(--border-color);
            transform: translateY(-1px);
        }

        .catalog-item:active {
            transform: scale(0.99);
        }

        .catalog-item img {
            width: 50px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            background: #2f3542;
        }

        .catalog-info {
            flex: 1;
        }

        .catalog-info h4 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 6px;
        }

        .badge-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            background: #2f3542;
            color: var(--text-muted);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .badge.eps {
            color: var(--accent-color);
            background: rgba(255, 71, 87, 0.15);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* --- NAVBAR ASLI KAMU (TIDAK DIUBAH SAMA SEKALI) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #1a1c23;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #2f3542;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            text-decoration: none; /* MENGHAPUS GARIS BAWAH PADA LINK */
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .nav-item:hover, .nav-item.active {
            color: #ff4757;
            text-decoration: none; /* MEMASTIKAN GARIS BAWAH TETAP HILANG SAAT HOVER/ACTIVE */
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        /* ==========================================
           DESKTOP VIEW
           ========================================== */
        .desktop-nav { display: none; }

        @media (min-width: 900px) {
            .bottom-nav { display: none; }

            .desktop-nav {
                display: flex;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 60px;
                background: #1a1c23;
                border-bottom: 1px solid #333;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 0 24px;
                z-index: 2000;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            }

            .dn-brand {
                display: flex;
                align-items: center;
                gap: 10px;
                position: absolute;
                left: 24px;
                font-size: 17px;
                font-weight: bold;
                color: #fff;
                letter-spacing: 0.5px;
            }
            .dn-brand img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; }
            .dn-brand span { color: #ff4757; }

            .dn-link {
                display: flex;
                align-items: center;
                gap: 8px;
                color: #888;
                text-decoration: none;
                padding: 9px 16px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                transition: all 0.2s;
            }
            .dn-link i { font-size: 15px; }
            .dn-link:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
            .dn-link.active { color: #ff4757; background: rgba(255, 71, 87, 0.12); }

            body { padding-top: 80px; padding-bottom: 30px; }

            /* Konten lebih luas */
            .header-title { max-width: 1200px; margin-left: auto; margin-right: auto; }
            .controls-wrapper {
                max-width: 1200px;
                margin-left: auto;
                margin-right: auto;
                flex-direction: row;
                align-items: center;
            }
            .controls-wrapper .search-box { flex: 3; margin-bottom: 0; }
            .controls-wrapper .filter-group { flex: 1; }
            .catalog-container {
                max-width: 1200px;
                margin-left: auto;
                margin-right: auto;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .catalog-item { padding: 12px 14px; }
            .catalog-item img { width: 60px; height: 85px; }
        }
    </style>
</head>
<body>

    <h2 class="header-title"><i class="fas fa-book"></i> Katalog A-Z</h2>

    <!-- SEARCH & FILTERING BARU -->
    <div class="controls-wrapper">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Cari anime..." oninput="filterAndRender()">
        </div>
        <div class="filter-group">
            <select id="sort-order" class="filter-select" onchange="filterAndRender()">
                <option value="asc">Urutan A-Z</option>
                <option value="desc">Urutan Z-A</option>
            </select>
            <select id="filter-type" class="filter-select" onchange="filterAndRender()">
                <option value="all">Semua Tipe</option>
                <option value="Season">Season</option>
                <option value="Movie">Movie</option>
                <option value="Series">Series</option>
            </select>
        </div>
    </div>

    <!-- CATALOG LIST -->
    <div id="catalog-list" class="catalog-container"></div>

    <!-- NAVBAR ASLI KAMU (SAMA PERSIS) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="schedule.html" class="nav-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Schedule</span>
        </a>
        <a href="catalog.html" class="nav-item active">
            <i class="fas fa-book"></i>
            <span>Catalog</span>
        </a>
        <a href="library.html" class="nav-item">
            <i class="fas fa-bookmark"></i>
            <span>Library</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- DESKTOP NAVBAR -->
    <nav class="desktop-nav">
        <div class="dn-brand">
            <img src="logo.png" alt="Logo">
            ANIME<span>HUB</span>
        </div>
        <a href="index.html" class="dn-link">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="schedule.html" class="dn-link">
            <i class="fas fa-calendar-alt"></i> Schedule
        </a>
        <a href="catalog.html" class="dn-link active">
            <i class="fas fa-book"></i> Catalog
        </a>
        <a href="library.html" class="dn-link">
            <i class="fas fa-bookmark"></i> Library
        </a>
        <a href="profile.html" class="dn-link">
            <i class="fas fa-user"></i> Profile
        </a>
    </nav>

    <script>
        let animeSeriesData = [];
        const animeDataReady = (async () => {
            try {
                const res = await fetch('/api/anime');
                if (res.ok) {
                    const full = await res.json();
                    animeSeriesData = full.map((a) => ({
                        id: a.id,
                        title: a.title,
                        poster: a.poster,
                        season: a.season || '',
                        totalEps: (a.episodes || []).length
                    }));
                }
            } catch (e) {
                console.error('Gagal memuat daftar anime:', e);
            }
        })();

        function filterAndRender() {
            const list = document.getElementById('catalog-list');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();
            const sortOrder = document.getElementById('sort-order').value;
            const filterType = document.getElementById('filter-type').value;

            // 1. Filtering
            let filteredData = animeSeriesData.filter(anime => {
                const matchSearch = anime.title.toLowerCase().includes(searchKeyword);
                const matchType = filterType === 'all' || anime.season.toLowerCase().includes(filterType.toLowerCase());
                return matchSearch && matchType;
            });

            // 2. Sorting
            filteredData.sort((a, b) => {
                return sortOrder === 'asc' 
                    ? a.title.localeCompare(b.title) 
                    : b.title.localeCompare(a.title);
            });

            // 3. Render Kosong
            if (filteredData.length === 0) {
                list.innerHTML = `<div class="empty-state">Anime tidak ditemukan...</div>`;
                return;
            }

            // 4. Render HTML
            list.innerHTML = filteredData.map(anime => `
                <div class="catalog-item" onclick="openAnimeDetail(${anime.id})">
                    <img src="${anime.poster}" alt="${anime.title}" onerror="this.onerror=null; this.src='https://via.placeholder.com/50x70?text=Anime';">
                    <div class="catalog-info">
                        <h4>${anime.title}</h4>
                        <div class="badge-container">
                            <span class="badge">${anime.season}</span>
                            <span class="badge eps">${anime.totalEps} Episode</span>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right" style="color: #444; font-size: 12px;"></i>
                </div>
            `).join('');
        }

        function openAnimeDetail(animeId) {
            window.location.href = `index.html?animeId=${animeId}`;
        }

        // Jalankan saat pertama kali dibuka
        animeDataReady.then(() => filterAndRender());
    </script>
</body>
</html>
